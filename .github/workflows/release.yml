name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.96'
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME must match the workspace version in Cargo.toml (v$version)" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci --prefix server/web
      - run: npm --prefix server/web run build
      # Build the UI once so every binary embeds identical assets.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: server/web/dist
          if-no-files-found: error
          retention-days: 1

  server:
    name: Server (${{ matrix.platform }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc requirement at 2.35.
          - platform: linux-amd64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: server/web/dist
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build
        run: |
          export GIT_SHA="$GITHUB_SHA"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export BUILD_DATE
          cargo build --locked --release
          test "$(target/release/pensieve --version)" = "pensieve ${GITHUB_REF_NAME#v}+${GIT_SHA:0:7} $BUILD_DATE"
      - name: Package
        run: |
          archive="pensieve-$GITHUB_REF_NAME-$PLATFORM.tar.gz"
          stage="$RUNNER_TEMP/pensieve-$PLATFORM"
          mkdir -p "$stage"
          cp target/release/pensieve LICENSE README.md pensieve.example.toml "$stage/"
          cp -R examples "$stage/"
          COPYFILE_DISABLE=1 tar -C "$stage" -czf "$archive" pensieve LICENSE README.md pensieve.example.toml examples
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pensieve-${{ matrix.platform }}
          path: |
            pensieve-*.tar.gz
            pensieve-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  docker:
    needs: server
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  release:
    needs: [server, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pensieve-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          cat ./*.sha256 | sort -k2 > checksums.txt
          test "$(wc -l < checksums.txt)" -eq 4
          sha256sum --check checksums.txt
      - name: Release metadata
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG%%+*}" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
