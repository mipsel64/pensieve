  <rect x="56" y="319" width="198" height="55" rx="10" fill="#141919" stroke="#1f2727"/>
  <circle cx="79" cy="347" r="11" fill="#b3a4e0" fill-opacity=".17" stroke="#b3a4e0"/>
  <text x="98" y="353" fill="#eef2f1" font-size="17">Codex</text>
  <rect x="56" y="387" width="198" height="69" rx="10" fill="#141919" stroke="#1f2727"/>
  <circle cx="79" cy="420" r="11" fill="#d9bd86" fill-opacity=".17" stroke="#d9bd86"/>
  <text x="98" y="414" fill="#eef2f1" font-size="17">Pi</text>
  <text x="98" y="438" fill="#bec5c4" font-size="15">via pi-pensieve</text>
  <text x="58" y="481" fill="#838e8d" font-size="16">any device</text>

  <text x="366" y="250" fill="#bec5c4" font-size="16" text-anchor="middle">MCP over HTTPS</text>
  <text x="366" y="274" fill="#bec5c4" font-size="16" text-anchor="middle">bearer token</text>
  <path d="M287 320H444m-11-10 11 10-11 10" fill="none" stroke="#87cbbd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="366" y="361" fill="#87cbbd" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">recall · search</text>
  <text x="366" y="387" fill="#87cbbd" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">read · write · edit</text>

