<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Pensieve: one memory for all your agents</title>
  <desc id="desc">Claude Code, Codex and Pi connect from any device using MCP over HTTPS to a Pensieve server. Markdown pages, revisions, links, search and journal live in one SQLite file. A read-only web UI shows search, graph, timeline and journal.</desc>
  <rect x="1" y="1" width="1278" height="588" rx="25" fill="#030404" stroke="#1f2727" stroke-width="2"/>

  <g transform="translate(42 38) scale(1.55)" color="#87cbbd">
    <path d="M12.8 13.2c-2.4-2.6.2-4.7 2.3-6.4 1.7-1.4 1.3-3.3-.3-4.3M18.6 13.4c1.7-2-.1-3.6 1.5-5.4.9-1 2.1-1.3 3.1-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="16" cy="16" rx="12.5" ry="3.2" fill="currentColor"/>
    <path d="M3.5 16.6C4.6 22.7 9.8 27 16 27s11.4-4.3 12.5-10.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  </g>
  <text x="105" y="78" fill="#eef2f1" font-size="34" font-weight="650" letter-spacing="-.7">Pensieve</text>
  <text x="44" y="121" fill="#bec5c4" font-size="19">One memory for all your agents, on every device</text>
  <path d="M42 151H1238" stroke="#1f2727"/>

  <rect x="40" y="190" width="230" height="302" rx="18" fill="#0d1111" stroke="#354141"/>
  <text x="58" y="229" fill="#eef2f1" font-size="22" font-weight="600">Agents</text>
