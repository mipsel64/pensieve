<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pensieve</title>
<style>
  :root { color-scheme: dark; --bg: #0f1117; --panel: #161922; --line: #262b38; --text: #e3e6ee; --muted: #8a93a6; --accent: #7aa2f7; --hit: #e0af68; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: minmax(320px, 420px) 1fr; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  aside { display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); }
  form { display: flex; gap: 8px; padding: 12px; }
  input[type=search], input[type=password] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 8px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #0f1117; font: inherit; font-weight: 600; cursor: pointer; }
  label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  #status { padding: 0 12px 8px; color: var(--muted); font-size: 12px; }
  #results { max-height: 40%; overflow: auto; border-bottom: 1px solid var(--line); }
  #results:empty { display: none; }
  .hit { display: block; padding: 8px 12px; color: inherit; text-decoration: none; }
  .hit:hover, .hit:focus-visible { background: #1e2230; outline: none; }
  .hit p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  mark { background: none; color: var(--hit); }
  #page { flex: 1; min-height: 0; overflow: auto; padding: 0 12px 12px; }
  #page h2 { margin: 12px 0 4px; font-size: 18px; }
  .meta { margin: 2px 0; color: var(--muted); font-size: 12px; }
  #page pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, monospace; }
  a { color: var(--accent); }
  a.missing { color: var(--muted); }
  #graph { min-width: 0; min-height: 0; overflow: hidden; }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
    aside { border-right: 0; }
  }
</style>
</head>
<body>
<aside>
  <form id="login" hidden>
    <input id="token" type="password" placeholder="Server token" aria-label="Server token" autocomplete="current-password" required>
    <button>Unlock</button>
  </form>
  <form id="search">
    <input id="q" type="search" placeholder="Search memory…" aria-label="Search memory" autocomplete="off">
    <label title="Rerank with Jev when the server has a key"><input id="rerank" type="checkbox" checked>Jev</label>
    <button>Search</button>
  </form>
  <div id="status" role="status"></div>
  <nav id="results" aria-label="Search results"></nav>
  <article id="page"></article>
</aside>
<main id="graph" aria-label="Page link graph"></main>
<script src="/force-graph.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
